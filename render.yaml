services:
  - type: web
    name: hr-management
    runtime: python
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn run:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COMPANY_NAME
        value: Your Company Pvt. Ltd.
      - key: COMPANY_ADDRESS
        value: Ahmedabad, Gujarat, India
