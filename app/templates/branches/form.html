{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

      <div class="card mb-3">
        <div class="card-header"><i class="bi bi-building me-2"></i>Branch Details</div>
        <div class="card-body row g-3">
          <div class="col-md-6">
            <label class="form-label">Branch Name *</label>
            <input type="text" name="name" class="form-control" value="{{ branch.name if branch else '' }}" required placeholder="e.g. Head Office, Ahmedabad Branch"/>
          </div>
          <div class="col-md-3">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-control" value="{{ branch.city or '' if branch else '' }}"/>
          </div>
          <div class="col-md-3">
            <label class="form-label">State</label>
            <input type="text" name="state" class="form-control" value="{{ branch.state or '' if branch else '' }}"/>
          </div>
          <div class="col-md-9">
            <label class="form-label">Address</label>
            <textarea name="address" class="form-control" rows="2">{{ branch.address or '' if branch else '' }}</textarea>
          </div>
          <div class="col-md-3">
            <label class="form-label">PIN Code</label>
            <input type="text" name="pin" class="form-control" value="{{ branch.pin or '' if branch else '' }}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" value="{{ branch.phone or '' if branch else '' }}"/>
          </div>
          <div class="col-md-8">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ branch.email or '' if branch else '' }}"/>
          </div>
        </div>
      </div>

      <div class="card mb-3">
        <div class="card-header"><i class="bi bi-person-badge me-2"></i>Branch Handling Person</div>
        <div class="card-body row g-3">
          <div class="col-md-4">
            <label class="form-label">Contact Person Name</label>
            <input type="text" name="contact_person" class="form-control" value="{{ branch.contact_person or '' if branch else '' }}" placeholder="Branch in-charge name"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Contact Phone</label>
            <input type="text" name="contact_phone" class="form-control" value="{{ branch.contact_phone or '' if branch else '' }}"/>
          </div>
          <div class="col-md-4">
            <label class="form-label">Contact Email</label>
            <input type="email" name="contact_email" class="form-control" value="{{ branch.contact_email or '' if branch else '' }}"/>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary px-4">Save Branch</button>
      <a href="{{ url_for('branches.list_branches') }}" class="btn btn-outline-secondary ms-2">
        <i class="bi bi-arrow-left me-1"></i>Back
      </a>
    </form>
  </div>
</div>
{% endblock %}
